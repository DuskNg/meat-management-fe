<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Cấu hình ngăn chặn lưu bộ nhớ đệm (cache) của trình duyệt để luôn tải bản mới nhất -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Ngăn chặn tự động thu phóng (auto-zoom) khi bấm vào ô nhập liệu trên điện thoại -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />

  <title>Quản lý công nợ</title>
  <meta name="title" content="Quản lý công nợ" />
  <meta property="og:title" content="Quản lý công nợ" />

  <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
  <style id="expo-reset">
    /* These styles make the body full-height */
    html,
    body {
      height: 100%;
    }

    /* These styles disable body scrolling if you are using <ScrollView> */
    body {
      overflow: hidden;
    }

    /* These styles make the root element full-height */
    #root {
      display: flex;
      height: 100%;
      flex: 1;
    }
  </style>

  <!-- CSS toàn cục để ép kiểu font chữ của các ô nhập liệu tối thiểu là 16px trên Web, chống zoom của iOS Safari -->
  <style>
    input,
    textarea,
    select {
      font-size: 16px !important;
    }
  </style>
</head>

<body>
  <!-- Sử dụng chế độ render tĩnh của Expo Router để hỗ trợ chạy khi không có JavaScript -->
  <noscript>
    Bạn cần bật JavaScript để chạy ứng dụng này.
  </noscript>
  <!-- Thẻ div gốc của ứng dụng Expo -->
  <div id="root"></div>

  <!-- Đăng ký Service Worker để tự động cập nhật app trên mọi thiết bị, đặc biệt giải quyết cache iOS Safari PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var isLocal = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1' ||
                      window.location.hostname === '0.0.0.0';

        // Trên môi trường dev / localhost: GỠ BỎ HOÀN TOÀN Service Worker để không bị reload lặp và không ảnh hưởng Metro
        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          return;
        }

        // Trên môi trường Production: Đăng ký Service Worker với URL tĩnh (không bao giờ truyền timestamp ngẫu nhiên gây reload lặp)
        var swUrl = '/sw.js';
        navigator.serviceWorker.register(swUrl)
          .then(function (registration) {
            console.log('[App] Service Worker đăng ký thành công:', registration.scope);
          })
          .catch(function (err) {
            console.error('[App] Đăng ký Service Worker thất bại:', err);
          });
      });
    }
  </script>
</body>

</html>
